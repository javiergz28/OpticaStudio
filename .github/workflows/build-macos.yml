name: Build macOS ARM64 Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Optica Studio (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and Electron types
        run: npm run lint

      - name: Build frontend and Electron main/preload bundles
        run: npm run desktop:build

      - name: Package Optica Studio.app and DMG (arm64)
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "Sin certificado Developer ID: firma ad hoc, sin notarización."
            npm run desktop:dist:local
          else
            npm run desktop:dist
          fi

      - name: Verify Apple Silicon (arm64) binary and DMG output
        run: |
          APP_BIN="release/mac-arm64/Optica Studio.app/Contents/MacOS/Optica Studio"
          DMG_FILE="release/Optica-Studio-macOS-arm64.dmg"

          test -d "release/mac-arm64/Optica Studio.app"
          test -f "$APP_BIN"
          test -f "$DMG_FILE"

          echo "=== Arquitectura del binario ==="
          file "$APP_BIN"
          lipo -info "$APP_BIN"

          if ! lipo -info "$APP_BIN" | grep -q "arm64"; then
            echo "Error: el binario generado no contiene arquitectura arm64."
            exit 1
          fi

          echo "=== Checksum SHA-256 del DMG ==="
          shasum -a 256 "$DMG_FILE"
          ls -lh "$DMG_FILE"

      - name: Upload DMG installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Optica-Studio-macOS-arm64-dmg
          path: release/Optica-Studio-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Optica-Studio-macOS-arm64.dmg
          generate_release_notes: true
