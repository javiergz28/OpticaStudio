<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:;"
    />
    <title>Seleccionar pantalla o ventana — Óptica Studio</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0c12;
        color: #f5f5f7;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(68% 55% at 20% 10%, rgba(56, 132, 255, 0.14) 0%, transparent 65%),
          radial-gradient(60% 50% at 85% 90%, rgba(245, 166, 35, 0.08) 0%, transparent 60%),
          #0a0c12;
      }
      header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        -webkit-app-region: drag;
      }
      .title-wrap h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .title-wrap p {
        margin: 3px 0 0;
        font-size: 11px;
        color: rgba(245, 245, 247, 0.65);
      }
      .tabs {
        display: inline-flex;
        padding: 3px;
        border-radius: 9999px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        -webkit-app-region: no-drag;
      }
      .tab-btn {
        border: none;
        background: transparent;
        color: rgba(245, 245, 247, 0.7);
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
      }
      .tab-btn.active {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .card {
        display: flex;
        flex-direction: column;
        padding: 8px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: pointer;
        text-align: left;
        color: inherit;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }
      .card:hover {
        background: rgba(255, 255, 255, 0.11);
        border-color: rgba(255, 255, 255, 0.25);
      }
      .card.selected {
        background: rgba(10, 132, 255, 0.2);
        border-color: rgba(56, 152, 255, 0.85);
        box-shadow: 0 0 0 2px rgba(56, 152, 255, 0.25);
      }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        object-fit: contain;
        background: #050608;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        min-width: 0;
      }
      .app-icon {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .name {
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #f5f5f7;
      }
      .empty {
        text-align: center;
        padding: 48px 16px;
        font-size: 12px;
        color: rgba(245, 245, 247, 0.65);
      }
      footer {
        padding: 12px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .hint {
        font-size: 11px;
        color: rgba(245, 245, 247, 0.6);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        border-radius: 9999px;
        padding: 7px 16px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: #f5f5f7;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .btn-primary {
        background: linear-gradient(180deg, rgba(56, 152, 255, 0.95) 0%, rgba(10, 132, 255, 0.92) 100%);
        border-color: rgba(135, 200, 255, 0.55);
        color: #ffffff;
        font-weight: 600;
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="title-wrap">
          <h1>Seleccionar ventana o pantalla</h1>
          <p>Elige la fuente que deseas capturar en Óptica Studio</p>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab-btn active" data-filter="all">Todo</button>
          <button type="button" class="tab-btn" data-filter="window">Ventanas</button>
          <button type="button" class="tab-btn" data-filter="screen">Pantallas</button>
        </div>
      </header>

      <main>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" hidden>
          No se encontraron ventanas o pantallas disponibles. Verifica el permiso de Grabación de Pantalla en Ajustes del Sistema de macOS.
        </div>
      </main>

      <footer>
        <span class="hint">Doble clic sobre una miniatura para capturarla al instante</span>
        <div class="actions">
          <button type="button" id="cancelBtn" class="btn">Cancelar</button>
          <button type="button" id="confirmBtn" class="btn btn-primary" disabled>Seleccionar</button>
        </div>
      </footer>
    </div>
    <script src="./picker-renderer.js"></script>
  </body>
</html>
